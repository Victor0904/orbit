<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>ORBIT</title>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#123A7A"/>
      <stop offset="0.45" stop-color="#0A1838"/>
      <stop offset="1" stop-color="#03050B"/>
    </radialGradient>
    <radialGradient id="coreHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5FA8FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5FA8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#FFF1CC" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FFF1CC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="256" y1="88" x2="394" y2="160">
      <stop offset="0" stop-color="#FFF1CC" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFF1CC" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- fond plein (maskable : contenu utile dans le cercle central de 80 %, r <= 205) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="#BFD4FF">
    <circle cx="84" cy="96" r="2" opacity=".6"/>
    <circle cx="430" cy="78" r="2.4" opacity=".7"/>
    <circle cx="452" cy="300" r="1.8" opacity=".5"/>
    <circle cx="70" cy="330" r="1.6" opacity=".5"/>
    <circle cx="150" cy="456" r="2" opacity=".55"/>
    <circle cx="400" cy="440" r="1.6" opacity=".5"/>
  </g>

  <!-- orbites : EXT (active, plus claire) et INT -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#9DB4E8" stroke-width="5" opacity=".6"/>
  <circle cx="256" cy="256" r="112" fill="none" stroke="#9DB4E8" stroke-width="4" opacity=".28"/>

  <!-- danger : arc rouge sur l'orbite intérieure (115° → 175°) -->
  <g filter="url(#glow)">
    <path d="M 208.7 357.5 A 112 112 0 0 1 144.4 265.8" fill="none" stroke="#FF2E4D" stroke-width="16" stroke-linecap="round"/>
    <path d="M 208.7 357.5 A 112 112 0 0 1 144.4 265.8" fill="none" stroke="#FFB8C4" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- noyau ATLAS -->
  <circle cx="256" cy="256" r="104" fill="url(#coreHalo)"/>
  <circle cx="256" cy="256" r="52" fill="#08122A" stroke="#5FA8FF" stroke-width="7"/>
  <g fill="none" stroke="#5FA8FF" stroke-width="4" opacity=".9">
    <ellipse cx="256" cy="256" rx="70" ry="15"/>
    <ellipse cx="256" cy="256" rx="70" ry="15" transform="rotate(60 256 256)"/>
    <ellipse cx="256" cy="256" rx="70" ry="15" transform="rotate(120 256 256)"/>
  </g>
  <circle cx="256" cy="256" r="13" fill="#BFD9FF"/>

  <!-- sillage du joueur sur l'orbite EXT (−90° → −35°) -->
  <path d="M 256 88 A 168 168 0 0 1 393.6 159.6" fill="none" stroke="url(#trail)" stroke-width="12" stroke-linecap="round"/>

  <!-- le point lumineux -->
  <circle cx="393.6" cy="159.6" r="46" fill="url(#starHalo)"/>
  <circle cx="393.6" cy="159.6" r="14" fill="#FFFFFF"/>
</svg>
